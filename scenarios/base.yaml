# Nominal scenario: one of each official item, generous spacing.
# The official set contains designed borderline items (detergent 0.73 ratio,
# helmet dome, hex «cylinder») whose physical rocking occasionally flips a
# measurement — always to the SAFE side. Conservative diversions are logged
# and tolerated; an unsafe route (bad item to the sorter) fails the run.
seed: 42
allow_conservative: true
items:
  bottle: 1
  box_s: 1
  box_l: 1
  lunchbox: 1
  sack: 1
  detergent: 1
  pouf: 1
  pen: 1
  plate: 1
  cylinder: 1
  helmet: 1
spawn_gap_s: [6.0, 8.0]
perception: camera           # real sensing (override with --perception oracle)
perception_latency_s: 0.15   # oracle mode only: modeled inference latency
max_sim_s: 400
