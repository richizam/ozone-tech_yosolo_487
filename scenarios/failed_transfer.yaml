# Failed transfer: the item discharges to B correctly, then stalls ON the
# incline connector (drive fault injection). The connector is outside the
# exception arm's reach envelope, so the honest industrial outcome is:
# zero-displacement watchdog -> operator call-out (manual removal), zero
# deadlock, zero unsafe. allow_conservative keeps the run green on that
# safe manual diversion.
seed: 42
perception: camera
executive: sorter
allow_conservative: true
items:
  box_s: 1
  bottle: 1
  lunchbox: 1
inject_jam:
  slug: box_s          # true zone B; snags mid-route in the routing zone
  at_y: 3.35           # pinned on the incline connector after discharge
                       # (north side — outside the arm's reach envelope)
spawn_gap_s: [6.0, 8.0]
max_sim_s: 240
